<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PULLZ Hub | Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    .admin-section { padding: 8rem 0 4rem; }
    .admin-container {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 16px;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }
    .admin-header {
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 1rem; margin-bottom: 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .admin-header h2 { color: #ef4444; margin: 0; font-family: 'Outfit', sans-serif; }
    
    .users-table {
      width: 100%; border-collapse: collapse; text-align: left;
    }
    .users-table th {
      padding: 1rem; border-bottom: 2px solid rgba(255,255,255,0.1);
      color: var(--text-muted); font-size: 0.9rem;
    }
    .users-table td {
      padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05);
      vertical-align: middle;
    }
    .user-info { display: flex; align-items: center; gap: 1rem; }
    .user-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .role-badge {
      font-size: 0.7rem; font-weight: bold; text-transform: uppercase;
      padding: 0.2rem 0.5rem; border-radius: 4px; letter-spacing: 0.5px;
      display: inline-block;
    }
    .role-Owner { background: linear-gradient(45deg, #ef4444, #f59e0b); color: white; }
    .role-Admin { background: #ef4444; color: white; }
    .role-Scripter { background: #8b5cf6; color: white; }
    .role-Helper { background: #10b981; color: white; }
    .role-Member { background: rgba(255,255,255,0.1); color: var(--text-muted); }
    
    .status-badge {
      font-size: 0.7rem; font-weight: bold; padding: 0.2rem 0.5rem; border-radius: 4px;
    }
    .status-ok { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .status-muted { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .status-banned { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

    .action-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.2);
      color: white; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer;
      font-size: 0.8rem; margin-right: 0.3rem; transition: 0.2s;
    }
    .action-btn:hover { background: rgba(255,255,255,0.1); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; }
    .btn-warn:hover { background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; color: #f59e0b; }
    .btn-success:hover { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #10b981; }

    #loading-users { text-align: center; padding: 2rem; color: var(--brand-cyan); }

    /* Edit Modal */
    .edit-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      z-index: 2000; display: none; align-items: center; justify-content: center;
    }
    .edit-modal-content {
      background: #111827; border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 16px; width: 90%; max-width: 400px;
      padding: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
    }
    .edit-close {
      position: absolute; top: 1rem; right: 1rem;
      background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer;
    }
    .edit-input-group { margin-bottom: 1rem; }
    .edit-input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
    .edit-input-group input, .edit-input-group select {
      width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; color: white; box-sizing: border-box; font-family: 'Inter', sans-serif;
    }
    .edit-input-group input:disabled { color: #6b7280; cursor: not-allowed; }
    .edit-input-group select { appearance: none; }
    .edit-save-btn {
      width: 100%; padding: 0.8rem; background: var(--brand-cyan); color: #000;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="bg-animated">
    <div class="blob blob-1" style="background: rgba(239,68,68,0.2);"></div>
    <div class="blob blob-2" style="background: rgba(245,158,11,0.2);"></div>
  </div>

  <header class="site-header">
    <nav class="nav shell" aria-label="Primary navigation">
      <a class="brand" href="index.html">
        <span class="brand-mark" style="color: #ef4444;">◆</span>
        <span><strong>PULLZ</strong> Control</span>
      </a>
                  <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#games">Games</a>
      </div>
    </nav>
  </header>

  <main class="admin-section shell">
    <div class="admin-container">
      <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h2>System Administration</h2>
          <span id="admin-viewer">Loading...</span>
        </div>
        <button class="action-btn" onclick="document.getElementById('vault-modal').style.display='flex'" style="background: #a855f7; color: white; border: none; padding: 0.6rem 1.2rem; cursor: pointer; border-radius: 6px; font-weight: bold; font-family: 'Inter', sans-serif;">🗝️ Key Vault</button>
      </div>

      <div id="loading-users">Fetching user database...</div>

      <table class="users-table" id="users-table" style="display: none;">
        <thead>
          <tr>
            <th>User</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-body">
          <!-- Populated by JS -->
        </tbody>
      </table>

      <div style="margin-top: 3rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; color: #38bdf8;">Recent Orders (Sell.app)</h2>
      </div>
      <div style="overflow-y: auto; max-height: 400px; background: rgba(0,0,0,0.4); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); padding: 1rem;">
        <table class="users-table" id="orders-table" style="margin: 0;">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer Email</th>
              <th>Product</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr><td colspan="5" style="text-align:center; padding: 2rem; color: #9ca3af;">Loading orders...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <div class="edit-modal" id="edit-modal">
    <div class="edit-modal-content">
      <button class="edit-close" onclick="document.getElementById('edit-modal').style.display='none'">&times;</button>
      <h3 style="color: white; margin-top: 0; font-family: 'Outfit', sans-serif;">Edit User</h3>
      <input type="hidden" id="edit-uid">
      
      <div class="edit-input-group">
        <label>Username</label>
        <input type="text" id="edit-username">
      </div>
      <div class="edit-input-group">
        <label>Avatar URL (or Base64)</label>
        <input type="text" id="edit-avatar" placeholder="Leave empty for default">
      </div>
      <div class="edit-input-group">
        <label>Role</label>
        <select id="edit-role">
          <option value="Member">Member</option>
          <option value="Helper">Helper</option>
          <option value="Scripter">Scripter</option>
          <option value="Admin">Admin</option>
          <option value="Owner">Owner</option>
        </select>
      </div>
      <div class="edit-input-group" id="edit-balance-group" style="display: none;">
        <label style="color: #f59e0b;">Balance ($) [OWNER ONLY]</label>
        <input type="number" id="edit-balance" step="0.01">
      </div>
      <div class="edit-input-group" id="edit-owner-actions-group" style="display: none; margin-top: 1rem; gap: 0.5rem; flex-direction: column;">
        <button class="action-btn btn-warn" id="edit-reset-vip-btn" style="width: 100%; font-size: 0.8rem; display: none;">Reset VIP Key</button>
        <button class="action-btn btn-danger" id="edit-reset-stats-btn" style="width: 100%; font-size: 0.8rem;">Reset Win/Loss Stats</button>
      </div>
      <div class="edit-input-group" title="Firebase blocks direct password changes on client side.">
        <label>Password</label>
        <input type="password" disabled value="********" title="Security Restricted (Backend Required)">
        <span style="font-size: 0.7rem; color: var(--text-muted);">Restricted by Firebase Security</span>
      </div>
      
      <!-- User Keys Section (Owner Only) -->
      <div id="edit-user-keys-section" style="border: 1px solid rgba(14, 165, 233, 0.3); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; background: rgba(14, 165, 233, 0.05); display: none;">
        <label style="color: #38bdf8; font-weight: bold; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">🔑 Owned Keys</label>
        <div id="user-keys-list" style="display: flex; flex-direction: column; gap: 0.5rem;">
          <span style="color: #9ca3af; font-size: 0.85rem;">Loading keys...</span>
        </div>
      </div>

      <!-- Give Key Section -->
      <div style="border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; background: rgba(168, 85, 247, 0.05);">
        <label style="color: #c084fc; font-weight: bold; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">🗝️ Give License Key</label>
        <div style="display: flex; gap: 0.5rem;">
          <select id="give-key-type" style="flex: 1; padding: 0.5rem; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white;">
            <option value="7-day">Weekly (7-Day)</option>
            <option value="30-day">Monthly (30-Day)</option>
            <option value="lifetime">Lifetime</option>
          </select>
          <button class="action-btn" onclick="window.giveKeyToUser()" style="background: #a855f7; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer;">Give Key</button>
        </div>
      </div>
      
      <div style="display: flex; gap: 1rem; margin-bottom: 0.5rem;">
        <button class="action-btn btn-warn" id="edit-mute-btn" style="flex:1;">Mute</button>
        <button class="action-btn btn-danger" id="edit-ban-btn" style="flex:1;">Ban</button>
      </div>
      
      <button class="edit-save-btn" onclick="window.saveUserEdit()">Save Changes</button>
    </div>
  </div>

  <!-- Key Vault Modal -->
  <div class="edit-modal" id="vault-modal">
    <div class="edit-modal-content" style="max-width: 600px;">
      <div class="edit-modal-header">
        <h2>🗝️ Key Vault Manager</h2>
        <button class="edit-close" onclick="document.getElementById('vault-modal').style.display='none'">&times;</button>
      </div>
      <div class="edit-input-group">
        <label>Package Type</label>
        <select id="vault-key-type">
          <option value="7-day">7-Day (Weekly)</option>
          <option value="30-day">30-Day (Monthly)</option>
          <option value="lifetime">Lifetime</option>
        </select>
      </div>
      <div class="edit-input-group">
        <label>Paste Keys (one per line)</label>
        <textarea id="vault-keys-input" rows="10" style="width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white; box-sizing: border-box; font-family: monospace; resize: none;"></textarea>
      </div>
      <button class="edit-save-btn" id="vault-upload-btn" onclick="window.uploadKeys()">Upload to Vault</button>
      <div id="vault-status" style="margin-top: 1rem; color: var(--brand-cyan); font-size: 0.85rem; text-align: center; font-weight: bold;"></div>
    </div>
  </div>

  <script type="module" src="auth-modal.js?v=6"></script>
  <script type="module">
    import { auth, db, doc, getDoc, getDocs, setDoc, updateDoc, collection, onAuthStateChanged, onSnapshot, serverTimestamp, query, orderBy, limit, where } from './firebase-config.js';

    let viewerRole = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      
      const userRef = doc(db, 'users', user.uid);
      
      onSnapshot(userRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          viewerRole = data.role;
          
          if (viewerRole !== 'Owner' && viewerRole !== 'Admin') {
            alert("Access Denied! You do not have administrative privileges.");
            window.location.href = 'index.html';
            return;
          }
  
          document.getElementById('admin-viewer').innerHTML = `Logged in as: <span class="role-badge role-${viewerRole}">${viewerRole}</span> ${data.username}`;
          if (!window.usersLoaded) {
            window.usersLoaded = true;
            loadUsers();
          }
        }
      });
    });

    window.usersData = {};
    let usersUnsubscribe = null;

    // Fetch Orders
    const ordersRef = collection(db, 'orders');
    const qOrders = query(ordersRef, limit(50));
    onSnapshot(qOrders, (snapshot) => {
      const tbody = document.getElementById('orders-tbody');
      if (snapshot.empty) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem; color: #9ca3af;">No orders found yet.</td></tr>';
        return;
      }
      
      tbody.innerHTML = '';
      snapshot.forEach(docSnap => {
        const order = docSnap.data();
        if(order.init) return;
        const tr = document.createElement('tr');
        
        let actualStatus = order.status;
        let backupDateStr = 'N/A';

        if (typeof actualStatus === 'string' && actualStatus.startsWith('{')) {
            try {
                let parsed = JSON.parse(actualStatus);
                if (parsed.status && parsed.status.status) {
                    actualStatus = parsed.status.status;
                    if (parsed.status.setAt) backupDateStr = new Date(parsed.status.setAt).toLocaleString();
                }
                else if (parsed.status) actualStatus = parsed.status;
            } catch(e) {}
        }
        if (typeof actualStatus !== 'string') actualStatus = 'UNKNOWN';
        actualStatus = actualStatus.toUpperCase();

        let statusColor = '#9ca3af'; 
        if(actualStatus.includes('COMPLETED') || actualStatus.includes('PAID')) statusColor = '#10b981';
        else if(actualStatus.includes('PENDING') || actualStatus.includes('CREATED')) statusColor = '#f59e0b';
        else if(actualStatus.includes('VOIDED') || actualStatus.includes('CANCELLED')) statusColor = '#ef4444';

        const statusBadge = `<span style="background: ${statusColor}22; color: ${statusColor}; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: bold; border: 1px solid ${statusColor}44;">${actualStatus}</span>`;

        let dateStr = backupDateStr;
        if(order.createdAt && order.createdAt.toDate) {
            dateStr = order.createdAt.toDate().toLocaleString();
        } else if (order.createdAt) {
            dateStr = new Date(order.createdAt).toLocaleString();
        }

        tr.innerHTML = `
          <td style="font-family: monospace; color: #9ca3af;">${order.invoice_id || docSnap.id}</td>
          <td>${order.customer_email || 'Unknown'}</td>
          <td style="font-weight: bold;">${order.product_title || 'Unknown Product'}</td>
          <td>${statusBadge}</td>
          <td style="font-size: 0.85rem; color: #9ca3af;">${dateStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }, (err) => {
      console.log("Orders snapshot error:", err);
      document.getElementById('orders-tbody').innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem; color: #ef4444;">Error loading orders. Check Security Rules.</td></tr>';
    });


    function loadUsers() {
      const tbody = document.getElementById('users-body');
      if (usersUnsubscribe) usersUnsubscribe();
      
      usersUnsubscribe = onSnapshot(collection(db, 'users'), (querySnapshot) => {
        tbody.innerHTML = '';
        window.usersData = {};
        
        querySnapshot.forEach((docSnap) => {
          const user = docSnap.data();
          const uid = docSnap.id;
          window.usersData[uid] = user;
          const role = user.role || 'Member';
        
        let avatar = `https://ui-avatars.com/api/?name=${user.username}&background=06b6d4&color=fff`;
        if (user.avatarBase64) avatar = user.avatarBase64;

        let statusClass = 'status-ok';
        let statusText = 'OK';
        if (user.isMuted) { statusClass = 'status-muted'; statusText = 'MUTED'; }
        if (user.isBanned) { statusClass = 'status-banned'; statusText = 'BANNED'; }

        const tr = document.createElement('tr');
        
        // Build Action Buttons
        let actionsHtml = '';
        if (role !== 'Owner' || viewerRole === 'Owner') {
          actionsHtml = `<button class="action-btn" onclick="window.openEditModal('${uid}')">Edit User</button>`;
        } else {
          actionsHtml = '<span style="color:var(--text-muted); font-size: 0.8rem;">Supreme Overlord</span>';
        }

        tr.innerHTML = `
          <td>
            <div class="user-info">
              <img src="${avatar}">
              <strong>${user.username}</strong>
            </div>
          </td>
          <td>${user.email}</td>
          <td><span class="role-badge role-${role}">${role}</span></td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          <td>${actionsHtml}</td>
        `;
        tbody.appendChild(tr);
        });
      
        document.getElementById('loading-users').style.display = 'none';
        document.getElementById('users-table').style.display = 'table';
      }, (e) => {
        console.error("Admin real-time error: ", e);
      });
    }

    // Expose functions to window for onclick
    window.openEditModal = (uid) => {
      const user = window.usersData[uid];
      if(!user) return;
      
      document.getElementById('edit-uid').value = uid;
      document.getElementById('edit-username').value = user.username;
      document.getElementById('edit-avatar').value = user.avatarBase64 || '';
      document.getElementById('edit-role').value = user.role || 'Member';
      
      if (viewerRole === 'Owner') {
        document.getElementById('edit-balance-group').style.display = 'block';
        document.getElementById('edit-balance').value = user.balance !== undefined ? user.balance : 0;
        
        document.getElementById('edit-owner-actions-group').style.display = 'flex';
        
        const resetVipBtn = document.getElementById('edit-reset-vip-btn');
        if (user.purchasedKey) {
          resetVipBtn.style.display = 'block';
          resetVipBtn.onclick = async () => {
            const { doc, updateDoc } = await import('./firebase-config.js');
            await updateDoc(doc(db, 'users', uid), { purchasedKey: null });
            if (window.showCustomAlert) window.showCustomAlert("Success", "VIP Key has been reset!");
            else alert("VIP Key Reset!");
            resetVipBtn.style.display = 'none';
            user.purchasedKey = null;
          };
        } else {
          resetVipBtn.style.display = 'none';
        }
        
        const resetStatsBtn = document.getElementById('edit-reset-stats-btn');
        resetStatsBtn.onclick = () => {
          const resetAction = async () => {
            await updateDoc(doc(db, 'users', uid), { highestWin: 0, highestLoss: 0 });
            if (window.showCustomAlert) window.showCustomAlert("Success", "Stats reset to $0.00!");
            else alert("Stats reset to $0.00!");
          };

          if (window.showCustomConfirm) {
            window.showCustomConfirm("Are you sure?", "This will reset highestWin and highestLoss to $0.00.", resetAction);
          } else {
            if (confirm("Reset highestWin and highestLoss to $0.00?")) {
              resetAction();
            }
          }
        };
      } else {
        document.getElementById('edit-balance-group').style.display = 'none';
        document.getElementById('edit-owner-actions-group').style.display = 'none';
      }
      
      const muteBtn = document.getElementById('edit-mute-btn');
      if (user.isMuted) {
        muteBtn.textContent = 'Unmute';
        muteBtn.className = 'action-btn btn-success';
        muteBtn.onclick = () => window.toggleMute(uid, false);
      } else {
        muteBtn.textContent = 'Mute';
        muteBtn.className = 'action-btn btn-warn';
        muteBtn.onclick = () => window.toggleMute(uid, true);
      }
      
      const banBtn = document.getElementById('edit-ban-btn');
      if (user.isBanned) {
        banBtn.textContent = 'Unban';
        banBtn.className = 'action-btn btn-success';
        banBtn.onclick = () => window.toggleBan(uid, false);
      } else {
        banBtn.textContent = 'Ban';
        banBtn.className = 'action-btn btn-danger';
        banBtn.onclick = () => window.toggleBan(uid, true);
      }
      
      if (viewerRole === 'Owner') {
        const keysSec = document.getElementById('edit-user-keys-section');
        keysSec.style.display = 'block';
        const keysList = document.getElementById('user-keys-list');
        keysList.innerHTML = '<span style="color: #9ca3af; font-size: 0.85rem;">Loading keys...</span>';
        
        getDocs(query(collection(db, 'stock_keys'), where('ownerUid', 'in', [uid, user.email || 'NO_EMAIL']))).then(snap => {
          if (snap.empty) {
            keysList.innerHTML = '<span style="color: #9ca3af; font-size: 0.85rem;">No keys found for this user.</span>';
          } else {
            let html = '';
            snap.forEach(docSnap => {
              const kData = docSnap.data();
              html += `<div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); padding: 0.5rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05);">
                <div>
                  <div style="color: white; font-family: monospace; font-size: 0.9rem;">${kData.key}</div>
                  <div style="color: #38bdf8; font-size: 0.75rem; text-transform: uppercase;">${kData.type}</div>
                </div>
                <button class="action-btn btn-danger" onclick="window.deleteUserKey('${docSnap.id}', '${uid}')" style="padding: 0.2rem 0.5rem; font-size: 0.7rem; min-width: 60px;">Delete</button>
              </div>`;
            });
            keysList.innerHTML = html;
          }
        }).catch(err => {
          keysList.innerHTML = '<span style="color: #ef4444; font-size: 0.85rem;">Failed to load keys.</span>';
          console.error(err);
        });
      } else {
        document.getElementById('edit-user-keys-section').style.display = 'none';
      }

      document.getElementById('edit-modal').style.display = 'flex';
    };

    window.saveUserEdit = async () => {
      const uid = document.getElementById('edit-uid').value;
      const oldUser = window.usersData[uid];
      const newUsername = document.getElementById('edit-username').value.trim();
      const newAvatar = document.getElementById('edit-avatar').value.trim();
      const newRole = document.getElementById('edit-role').value;
      
      const updates = {};
      if (newRole !== oldUser.role) updates.role = newRole;
      if (newAvatar !== (oldUser.avatarBase64 || '')) updates.avatarBase64 = newAvatar;
      if (newAvatar === '') updates.avatarBase64 = null;
      
      if (viewerRole === 'Owner') {
        const newBal = parseFloat(document.getElementById('edit-balance').value);
        if (!isNaN(newBal) && newBal !== oldUser.balance) {
          updates.balance = newBal;
        }
      }
      
      try {
        if (newUsername !== oldUser.username) {
           const { doc, getDoc, setDoc, deleteDoc } = await import('./firebase-config.js');
           const checkSnap = await getDoc(doc(db, 'usernames', newUsername));
           if(checkSnap.exists()) return alert("Username already taken!");
           
           await setDoc(doc(db, 'usernames', newUsername), { uid: uid });
           await deleteDoc(doc(db, 'usernames', oldUser.username));
           updates.username = newUsername;
        }
        
        if (Object.keys(updates).length > 0) {
           await updateDoc(doc(db, 'users', uid), updates);
        }
        document.getElementById('edit-modal').style.display = 'none';
        loadUsers();
      } catch(e) {
        alert("Error saving user: " + e.message);
      }
    };
    
    window.toggleMute = async (uid, muteStatus) => {
      await updateDoc(doc(db, 'users', uid), { isMuted: muteStatus });
      loadUsers();
    };
    
    window.toggleBan = async (uid, banStatus) => {
      if(banStatus && !confirm("Are you sure you want to BAN this user?")) return;
      await updateDoc(doc(db, 'users', uid), { isBanned: banStatus });
      loadUsers();
    };
    
    window.deleteUserKey = async (docId, uid) => {
      let confirmed = false;
      if (window.showCustomConfirm) {
        window.showCustomConfirm("Delete Key?", "Are you sure you want to delete this key?", async () => {
          try {
            const { deleteDoc } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
            await deleteDoc(doc(db, 'stock_keys', docId));
            if (window.showCustomAlert) window.showCustomAlert("Success", "Key deleted successfully!");
            else alert("Key deleted!");
            window.openEditModal(uid); // refresh the modal
          } catch(e) {
            console.error(e);
            alert("Error deleting key.");
          }
        });
      } else {
        if (confirm("Delete this key?")) {
          try {
            const { deleteDoc } = await import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
            await deleteDoc(doc(db, 'stock_keys', docId));
            alert("Key deleted!");
            window.openEditModal(uid);
          } catch(e) {
            console.error(e);
            alert("Error deleting key.");
          }
        }
      }
    };

    window.giveKeyToUser = async () => {
      const targetUid = document.getElementById('edit-uid').value;
      const keyType = document.getElementById('give-key-type').value;
      
      if(!targetUid) return alert("Error: User not selected.");
      
      try {
        const { query, where, limit, getDocs } = await import('./firebase-config.js');
        const q = query(collection(db, 'stock_keys'), where('type', '==', keyType), where('available', '==', true), limit(1));
        const snap = await getDocs(q);
        
        if (snap.empty) {
          alert(`OUT OF STOCK! You don't have any available ${keyType} keys in the vault.`);
          return;
        }
        
        const keyDoc = snap.docs[0];
        const keyData = keyDoc.data();
        
        let expiresAt = null;
        if (keyType === '7-day') expiresAt = Date.now() + (7 * 24 * 60 * 60 * 1000);
        if (keyType === '30-day') expiresAt = Date.now() + (30 * 24 * 60 * 60 * 1000);
        
        await updateDoc(keyDoc.ref, {
          available: false,
          ownerUid: targetUid,
          assignedAt: Date.now(),
          expiresAt: expiresAt
        });
        
        alert(`Success! Assigned key ${keyData.key} (${keyType}) to the user.`);
      } catch (err) {
        alert("Failed to give key: " + err.message);
      }
    };
    
    // Key Vault Logic
    window.uploadKeys = async function() {
      const type = document.getElementById('vault-key-type').value;
      const rawText = document.getElementById('vault-keys-input').value;
      
      const lines = rawText.split('\n').map(l => l.trim());
      const keys = [];
      for (const line of lines) {
        if (line.includes('PULLZ-')) {
          const match = line.match(/PULLZ-[A-Z0-9\-]+/);
          if (match) keys.push(match[0]);
        }
      }
      
      if (keys.length === 0) {
        alert("No valid keys found! Make sure keys contain PULLZ-");
        return;
      }
      
      const statusDiv = document.getElementById('vault-status');
      statusDiv.innerText = `Uploading ${keys.length} keys to secure vault... please wait.`;
      const btn = document.getElementById('vault-upload-btn');
      btn.disabled = true;
      btn.style.opacity = '0.5';
      
      let successCount = 0;
      
      for (let key of keys) {
        try {
          await setDoc(doc(db, 'stock_keys', key), {
            key: key,
            type: type,
            available: true,
            addedAt: serverTimestamp()
          });
          successCount++;
        } catch(e) {
          console.error(e);
        }
      }
      
      btn.disabled = false;
      btn.style.opacity = '1';
      statusDiv.innerText = `Success! Added ${successCount} keys to the ${type} inventory.`;
      document.getElementById('vault-keys-input').value = '';
    };
  </script>
</body>
</html>
